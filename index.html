<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Island Portfolio RPG</title>
<!-- Responsive + zoom prevention: no pinch / double-tap zoom on phones and tablets -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0b1d33">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  /* bundled pixel font for building plaques and signposts (assets/fonts/OFL.txt) */
  @font-face { font-family: 'Pixelify Sans'; src: url('assets/fonts/PixelifySans-Regular.ttf') format('truetype'); font-display: block; }
  html, body { margin: 0; width: 100%; height: 100%; background: #0b1d33; overflow: hidden; overscroll-behavior: none;
               font-family: system-ui, sans-serif; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #game { position: fixed; inset: 0; }                     /* Phaser FIT scales + centres its canvas inside this box */
  #game canvas { display: block; touch-action: none; }

  /* ---- HUD / hint / portal overlays ---- */
  #hud  { position: fixed; z-index: 5; left: 12px; top: 10px; color: #fff; font: 13px/1.5 system-ui; text-shadow: 0 1px 3px #000; pointer-events: none; }
  #hint { position: fixed; z-index: 5; left: 50%; bottom: 28px; transform: translateX(-50%); color: #fff; background: #000b; padding: 6px 14px; border-radius: 14px;
          font: 14px system-ui; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; }
  #portal { position: fixed; z-index: 10; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
            background: radial-gradient(circle, #7a4cf0, #05030f 70%); color: #fff; opacity: 0; pointer-events: none; transition: opacity .5s; }
  #portal.on { opacity: 1; pointer-events: auto; }
  #portal h1 { margin: 0 0 8px; font-size: clamp(24px, 6vw, 44px); }

  /* ---- audio controls: independent Music (BGM) and SFX volume + mute ---- */
  #audio-ui { position: fixed; z-index: 20; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; padding: 8px 10px; border-radius: 12px;
              background: #000a; color: #fff; font: 11px system-ui; backdrop-filter: blur(4px); }
  #audio-ui .row { display: flex; align-items: center; gap: 8px; }
  #audio-ui button { width: 34px; height: 34px; border: 0; border-radius: 8px; background: #ffffff22; color: #fff; font-size: 17px; cursor: pointer; touch-action: manipulation; }
  #audio-ui button.off { background: #c0392b66; }
  #audio-ui label { width: 34px; opacity: .8; }
  #audio-ui input[type=range] { width: clamp(70px, 14vw, 120px); accent-color: #ffd36b; touch-action: manipulation; }
</style>
</head>
<body>
  <div id="game"></div>
  <div id="hud"></div>
  <div id="hint"></div>
  <div id="portal"><h1></h1><p>Press Space / Esc or tap to return to the island</p></div>

  <!-- audio controls (handled by AudioSystem in game.js) -->
  <div id="audio-ui" aria-label="Audio controls">
    <div class="row"><button id="mute-music" title="Mute / unmute music" aria-label="Toggle music">&#127925;</button><input id="vol-music" type="range" min="0" max="100" aria-label="Music volume"><label>Music</label></div>
    <div class="row"><button id="mute-sfx" title="Mute / unmute sound effects" aria-label="Toggle sound effects">&#128266;</button><input id="vol-sfx" type="range" min="0" max="100" aria-label="Effects volume"><label>SFX</label></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
